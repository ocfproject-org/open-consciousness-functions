entries:
  hplus.function.ocf-exp-007.opener:
    status: reviewed
    version: 1.0.0
    text: You will now learn to form an Energy Ball around yourself, change its size, and draw it back
      within whenever you choose.
    notes: Owner approved this exact teaching, activation and closer on 2026-11-21. Listening and release
      approval remain separate.
  hplus.function.ocf-exp-007.guided-first:
    status: reviewed
    version: 2.1.0
    text: |-
      Bring your attention to your heart center, in the middle of your chest.

      Imagine a small sun there, warm and bright, representing your own gathered energy.

      You can picture its light, sense its warmth or presence, or simply understand that this is where the movement begins. Follow the exercise in whichever way comes naturally.

      Now choose to expand your Energy Ball.

      Let the sun open outward from your heart center, growing through and around you.

      Let it extend in front of your body.

      Behind your back.

      To your left and to your right.

      Beyond your head and beyond your feet.

      Allow it to become one complete ball of energy surrounding you.

      Let it settle at a comfortable size, with room around your whole body.

      You are resting at its center.

      If you would like to expand it farther, you can take another comfortable deep breath.

      As you breathe out, imagine gently blowing your Energy Ball larger, as though your breath were filling a bubble.

      Let it widen smoothly in every direction.

      You can use this breath whenever it helps, or simply choose for the ball to expand.

      Now set your Energy Ball turning.

      You can imagine giving the inside of the ball a gentle sideways push, setting it in motion.

      Or simply choose for it to begin turning.

      You remain comfortably still at its center.

      Let the rotation become smooth and continuous.

      Faster.

      And faster again.

      Let it keep accelerating until, in your imagination, its movement becomes too fast to follow and the spinning ball becomes an invisible field around you.

      It remains fully expanded.

      You can sense its presence or simply know that it is there.

      You may imagine the warmth of sunlight, a flowing current, or the fine tingling of static electricity as its energy moves around you.

      You can also imagine its increasing speed building a magnetic field, attracting what you desire and repelling what you do not want.

      Let these qualities remain with the spinning field.

      You can extend your Energy Ball to include a larger space.

      For this practice, bring to mind what you would like it to surround.

      It might be you and your bicycle, your vehicle and its passengers, your home, or another person beside you.

      Choose one example.

      Let the ball expand beyond its present size.

      If it helps, use another comfortable breath, imagining the bubble growing larger as you breathe out.

      Allow it to reach beyond everything you have chosen to include: in front, behind, to either side, above, and below.

      Give everything room within it.

      Let the field continue spinning around this larger space.

      If you include another person, hold an intention of goodwill, with their feelings and choices remaining their own.

      Now bring the ball back to its usual size around your body.

      Let it draw inward until it rests at a comfortable distance from you again.

      It remains inflated and spinning.

      Now practise drawing the ball fully back within.

      Let the spinning settle as your Energy Ball draws inward.

      However far you have extended it, allow the whole ball to return.

      Gather its light and energy back through your heart center.

      Let that energy settle gently throughout you.

      The surrounding ball has returned within.
    timing:
      pacing_units:
      - sentence
      - sentence
      - sentence
      - landing
      - sentence
      - sentence
      - landing
