      - landing
  hplus.function.ocf-exp-007.guided-second:
    status: reviewed
    version: 2.1.0
    text: |-
      Now practise again with less guidance.

      Let the familiar sun expand around you.

      Allow your Energy Ball to take its usual shape and begin turning.

      Let it accelerate into the familiar invisible field.

      Use the breath or the imagined push if either helps you, or let the whole movement follow your intention.

      Draw the whole ball back through your heart center and let it settle within you.
    timing:
      pacing_units:
      - sentence
      - sentence
      - sentence
      - sentence
      - landing
      - landing
  hplus.function.ocf-exp-007.function-body:
    status: reviewed
    version: 2.1.0
    notes: Introduces both cues in Focus Eleven Access; repeated as passive reinforcement in the sleep passes.
    text: |-
      From now on, whenever you choose to establish your Energy Ball, the cue to think is {{ cue.primary }}.
      Whenever you choose to draw the whole ball back within, the cue to think is {{ cue.id.OCF-CMD-EXP-007-DEFLATE }}.
      You can use either cue deliberately, with ordinary breathing and your eyes open or closed.
    cue_template:
      function_id: OCF-EXP-007
      allowed:
      - cue.primary
      - cue.id.OCF-CMD-EXP-007-DEFLATE
  hplus.function.ocf-exp-007.waking-descent:
    status: reviewed
    version: 1.0.0
    text: |-
      I will now count down from twenty.
      With each lower number, become a little more awake and alert, and more aware of your body and surroundings.

      Twenty. Nineteen. Eighteen. Seventeen. Sixteen.
      Fifteen. Fourteen. Thirteen. Twelve. Eleven.
    timing:
      pacing_units: [instruction, instruction, countdown, countdown, countdown, countdown, countdown, countdown, countdown, countdown, countdown, countdown]
  hplus.function.ocf-exp-007.waking-ten:
    status: reviewed
    version: 1.0.0
    text: Ten.
    timing:
      pacing_units: [countdown]
  hplus.function.ocf-exp-007.waking-count-to-one:
    status: reviewed
    version: 1.0.0
    text: |-
      Nine. Eight. Seven. Six. Five. Four. Three. Two. One.
    timing:
      pacing_units: [countdown, countdown, countdown, countdown, countdown, countdown, countdown, countdown, final_countdown]
  hplus.function.ocf-exp-007.waking-alert:
    status: reviewed
    version: 1.0.0
    text: |-
      Wake up and open your eyes. Notice the room around you.
      Take a moment to feel refreshed, clear and alert, ready to continue with renewed energy.
  hplus.function.ocf-exp-007.waking-reorient:
    status: reviewed
    version: 1.0.0
    text: |-
      Think of the number One. Wake up and open your eyes, clear and alert.
      Notice the room around you and the surface supporting you.
  hplus.function.ocf-exp-007.closer:
    status: reviewed
    version: 1.2.0
    text: |-
      Let the ball remain deflated as this practice finishes.

      Notice your body resting against the surface beneath you.

      Let your attention include the room and the sounds around you.

      When you choose to use your Energy Ball again, the cues you learned are available to you.

      The extra breath and the imagined push remain available whenever you find them helpful.

      Take this clear, refreshed awareness and energy with you as you continue.
