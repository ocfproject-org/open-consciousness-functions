entries:
  hplus.function.ocf-bod-014.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to direct your body''s natural processes of repair, regeneration, and
      reconstruction toward a specific part of your physical body, supporting the restoration of damaged, weakened,
      or missing structures toward their healthy form and function.'
  hplus.function.ocf-bod-014.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-014
      allowed:
      - cue.primary
    text: 'From this moment forward, let your body''s natural processes of repair, rebuilding, and regeneration
      become stronger, more coordinated, and more effective.


      Your physical body contains the biological patterns and instructions that guide the formation, maintenance,
      and renewal of its structures.


      Let your cells work together through their natural processes of growth, specialization, and repair, supporting
      the restoration of healthy tissue and function.


      Let circulation supply the oxygen and nourishment needed for this work, while your body''s maintenance systems
      process damaged and unnecessary material.


      Let these regenerative processes work together with precision, supporting the reconstruction of healthy structures
      in their proper form, position, and organization.


      This pattern of repair, reconstruction, and regeneration is permanently established within you.


      Your body''s natural maintenance and regenerative processes continue automatically, whether you are awake,
      resting, or asleep, without conscious effort.


      Whenever you wish to direct additional regeneration toward a particular part of your body, you can do so easily.


      Simply close your eyes and think of the specific part you wish to regenerate.


      You do not need to know its internal anatomy or picture it in your mind. Simply identify the part you wish
      to restore and its intended healthy function.


      Take a deep breath in and gently hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth and open your eyes.


      As you exhale, let your body''s natural processes of repair, regeneration, and reconstruction support the
      selected part, working toward its healthy structure and function.


      The more you use this command, the easier and more effective this conscious reinforcement becomes.


      Your body''s natural processes of maintenance and renewal continue automatically, supporting the restoration
      and healthy function of its structures.'
  hplus.function.ocf-bod-014.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-014
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to direct regeneration toward a specific part of your physical body, close
      your eyes and think of the part you wish to restore.


      Inhale deeply and gently hold your breath.


      Silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth and open your eyes.


      This concludes your OCF Regenerate exercise.'
