entries:
  hplus.function.ocf-exp-005.opener:
    status: reviewed
    version: 1.0.0
    cue_template:
      function_id: OCF-EXP-005
      allowed:
      - function.title
    text: |-
      This OCF exercise will teach you to establish {{ function.title }}, a lasting protective intention that maintains a calm, comfortable space around your body, encouraging unwanted insects to keep their distance and move peacefully elsewhere.
    notes: New OCF-authored adaptation of the supplied Clear Zone exercise. Introduces an ongoing, consciously
      chosen intention to discourage unwanted insect contact while maintaining calm awareness. No independently
      authenticated source, source checksum, or historical lineage is claimed. Proposed identity remains
      subject to registry allocation and explicit editorial review.
  hplus.function.ocf-exp-005.function-body:
    status: reviewed
    version: 1.1.0
    cue_template:
      function_id: OCF-EXP-005
      allowed:
      - function.title
      - cue.primary
      - cue.id.OCF-CMD-EXP-005-OBSERVE
      - cue.id.OCF-CMD-EXP-005-SUSPEND
    text: |-
      From this moment forward, {{ function.title }} is permanently established within your total self, maintaining a clear and comfortable space around your entire body.

      Your conscious mind, subconscious mind, physical being, and higher self work together, naturally discouraging unwanted insect contact.

      Whenever insects approach, your total self maintains one clear intention: remain away, move away, and continue peacefully elsewhere.

      This pattern works without harm to other life, preserving your comfort and natural awareness of your surroundings.

      {{ function.title }} continues operating automatically, without requiring conscious attention or repeated commands.

      Whenever you wish to reinforce or restore this pattern, simply say to yourself,
      "{{ cue.primary }}."

      Your total self strengthens the established intention, maintaining a clear personal space around you.

      You also have two optional commands.

      When you wish to observe or interact with insects without discouraging their approach, silently say,
      "{{ cue.id.OCF-CMD-EXP-005-OBSERVE }}."

      The outward insect-discouragement intention pauses, while your calm awareness remains available.

      Whenever you wish to pause the entire {{ function.title }} application, silently say,
      "{{ cue.id.OCF-CMD-EXP-005-SUSPEND }}."

      The application rests, while your ordinary awareness and natural responses continue.

      Each selected mode replaces the previous one.

      Observe and Suspend are temporary. They end automatically when you enter normal sleep, lose consciousness, or deliberately invoke "{{ cue.primary }}" again.

      Your original protective pattern then resumes.

      Your learned ability remains permanently available, regardless of which mode you choose.

      The more you use these commands, the easier and more natural establishing and adjusting {{ function.title }} becomes.
    notes: New OCF wording based on the maintainer-supplied Clear Zone draft. Preserves permanent automatic
      operation as the intended baseline, whole-self participation, non-destructive insect discouragement,
      primary reinforcement and restoration, and distinct Observe and Suspend overrides. Observe pauses
      the outward-directed intention while Clear Zone's calm awareness remains; Suspend pauses the whole
      application without removing learning or ordinary bodily responses. Only one mode is selected at
      a time; a new selection replaces the previous mode. Normal sleep onset, loss of consciousness, or
      deliberate primary invocation restores automatic mode. Meditation or hearing a command during instruction
      does not itself select an override. All three commands are breath-independent and require no eye
      closure. Quantum terminology is replaced with total-self
      and intention language rather than a claimed physical mechanism. Primary and mode cues require separate
      stable command records; the two mode references use explicit same-owner command IDs. One reusable
      body is intended for four scheduled passes. Shared state transitions and practice pauses remain
      outside this body. Intended effects and automatic operation are exercise suggestions, not verified
      insect repellency. Editorial and integration review remain pending.
  hplus.function.ocf-exp-005.closer:
    status: reviewed
    version: 1.1.0
    cue_template:
      function_id: OCF-EXP-005
      allowed:
      - function.title
      - cue.primary
      - cue.id.OCF-CMD-EXP-005-OBSERVE
      - cue.id.OCF-CMD-EXP-005-SUSPEND
    text: |-
      Remember, whenever you wish to reinforce or restore your clear personal zone, silently say,
      "{{ cue.primary }}."

      Use "{{ cue.id.OCF-CMD-EXP-005-OBSERVE }}" to temporarily allow intentional insect contact, or "{{ cue.id.OCF-CMD-EXP-005-SUSPEND }}" to pause the entire application.

      Your normal {{ function.title }} pattern resumes when you invoke its primary command or when a temporary override ends.

      This concludes your OCF {{ function.title }} exercise.
    notes: New OCF-authored reminder, not historical transcript wording. Includes the primary reinforcement/restoration
      cue and both distinct overrides. The body teaches automatic reset conditions; the closer does not
      repeat reinforcement or install a new control command. All three commands are breath-independent.
      Requires registered function and reviewed locale cues. Editorial
      approval and finished-session review remain pending.
