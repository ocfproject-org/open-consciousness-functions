entries:
  hplus.function.ocf-bod-011.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will teach you to strengthen your body''s natural ability to regulate and balance its
      hormonal systems, supporting physical comfort, emotional stability, mental clarity, and overall well-being
      throughout the hormonal changes of life.'
  hplus.function.ocf-bod-011.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-011
      allowed:
      - cue.primary
    text: 'From this moment forward, let your body''s natural processes of hormonal regulation and adaptation work
      together smoothly, efficiently, and in healthy balance.


      Your body''s hormonal systems communicate and coordinate with one another, adjusting naturally to your changing
      needs throughout life.


      Let your body maintain the hormonal balance appropriate for each stage of your life, responding to natural
      changes without unnecessary strain or imbalance.


      During periods of hormonal transition, let your body adapt smoothly and comfortably, supporting your physical
      strength, energy, and natural well-being.


      Let unnecessary physical tension and discomfort ease.


      Your emotions become calmer and steadier, your thoughts clearer, and your ability to respond to everyday situations
      more balanced and confident.


      Your body continues adapting to its changing needs, maintaining healthy coordination among its natural regulatory
      systems.


      This pattern of hormonal regulation, adaptation, and balance is permanently established within you.


      It continues automatically, whether you are awake, resting, or asleep, adjusting naturally as your body''s
      needs change without conscious effort.


      Whenever you wish to reinforce this established pattern, take a deep breath in and gently hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      As you exhale, let this pattern of healthy hormonal regulation and adaptation continue throughout your body,
      supporting physical comfort, emotional steadiness, and mental clarity.


      The more you use this command, the easier and more effective this conscious reinforcement becomes.'
  hplus.function.ocf-bod-011.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-011
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to reinforce your body''s natural hormonal regulation and balance, inhale
      deeply and gently hold your breath.


      Silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      This concludes your OCF Hormonal Transitions exercise.'
