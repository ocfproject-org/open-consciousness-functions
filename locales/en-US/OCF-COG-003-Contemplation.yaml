entries:
  hplus.function.ocf-cog-003.opener:
    status: reviewed
    version: 1.2.0
    text: |-
      This OCF exercise will teach you to open communication with your total self, connecting your conscious mind, subconscious mind, and higher self for deeper understanding.
  hplus.function.ocf-cog-003.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-COG-003
      allowed:
      - cue.id.OCF-CMD-COG-003-CLOSED
      - cue.primary
    text: |-
      From this moment forward, you have the ability to communicate with your total self whenever you choose.

      Your conscious mind, subconscious mind, higher self, and deeper aspects of your being are connected as one complete self.

      Whenever you wish to open this communication, close your eyes.

      Take a deep breath in and gently hold it.

      While holding your breath, silently say to yourself,
      "{{ cue.primary }}."

      Then slowly exhale through your mouth and continue breathing naturally.

      Your body relaxes while your mind remains calm, awake, and aware.

      Communication throughout your total self opens naturally, allowing knowledge, understanding, and deeper perspectives to enter your conscious awareness.

      You may ask questions, explore ideas, and receive insights from the greater awareness of your total self.

      Information may arise as thoughts, memories, words, feelings, or direct intuitive understanding.

      Your subconscious mind and higher self cooperate with your conscious awareness, bringing forward information and perspectives relevant to your contemplation.

      You can recognize and remember the understanding gained through this communication.

      This ability to commune with your total self remains permanently available whenever you choose.

      When you wish to end the present contemplation, silently say to yourself,
      "{{ cue.id.OCF-CMD-COG-003-CLOSED }}."

      The contemplative state ends, and your awareness returns naturally to its ordinary state.

      The knowledge and understanding gained remain available to you.
  hplus.function.ocf-cog-003.closer:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-COG-003
      allowed:
      - cue.id.OCF-CMD-COG-003-CLOSED
      - cue.primary
    text: |-
      Remember, whenever you wish to communicate with your total self, close your eyes.

      Inhale deeply and gently hold your breath.

      Silently say to yourself,
      "{{ cue.primary }}."

      Then slowly exhale through your mouth and continue breathing naturally.

      When you wish to end contemplation, silently say,
      "{{ cue.id.OCF-CMD-COG-003-CLOSED }}."

      This concludes your OCF Contemplation exercise.
