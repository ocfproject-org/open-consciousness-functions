entries:
  hplus.function.ocf-bod-015.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will teach you to temporarily reduce discomfort and sensitivity
      in a specific part of your body, and restore ordinary sensitivity whenever you
      choose.'
  hplus.function.ocf-bod-015.function-body:
    status: reviewed
    version: 1.1.1
    cue_template:
      function_id: OCF-BOD-015
      allowed:
      - cue.primary
      - cue.id.OCF-CMD-BOD-015-LEGACY-02
    text: 'From this moment forward, you have the ability to temporarily reduce discomfort
      and sensitivity in a specific part of your physical body.


      This ability allows you to direct a temporary numbing response toward the area
      you choose, while keeping your mind clear, alert, and aware.


      Whenever you wish to activate this response, simply close your eyes and think
      of the specific part of your body where you want temporary numbing.


      Take a deep breath in and gently hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      As you exhale, let discomfort and sensitivity in the selected area diminish,
      becoming less intense and less demanding of your attention.


      Let the selected area become comfortably numb, while the rest of your body maintains
      its ordinary sensitivity.


      Your mind remains clear and alert, allowing you to direct your attention where
      it is needed.


      This response is temporary and applies only to the specific area you have chosen.


      Whenever you wish to end the numbing response and restore ordinary sensitivity,
      use your release command.


      Close your eyes and think of the same selected area.


      Take a deep breath in and gently hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.id.OCF-CMD-BOD-015-LEGACY-02 }}."


      Then slowly exhale through your mouth.


      As you exhale, let the temporary numbing response end, allowing ordinary sensitivity
      to return smoothly and naturally to the selected area.


      You remain in conscious control of when to activate or release this temporary
      response.


      Your ability to use these commands is permanently available, while each numbing
      application remains temporary.


      The more you use these commands, the easier and more familiar activating and
      releasing the response becomes.


      At all other times, your body maintains its ordinary awareness and sensitivity.'
  hplus.function.ocf-bod-015.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-015
      allowed:
      - cue.primary
      - cue.id.OCF-CMD-BOD-015-LEGACY-02
    text: 'Remember, whenever you wish to temporarily reduce discomfort or sensitivity
      in a specific part of your body, close your eyes and think of the area you wish
      to affect.


      Inhale deeply and gently hold your breath.


      Silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      Whenever you wish to restore ordinary sensitivity, repeat the same sequence
      for that area using

      "{{ cue.id.OCF-CMD-BOD-015-LEGACY-02 }}."


      This concludes your OCF Temporary Numbing exercise.'
