entries:
  hplus.function.ocf-bod-013.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to strengthen your body''s natural processes
      of healing, repair, regeneration, and ongoing maintenance, establishing a lasting
      pattern of healthy balance throughout your entire body.'
  hplus.function.ocf-bod-013.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-BOD-013
      allowed:
      - cue.primary
    text: 'From this moment forward, let your body''s natural processes of healing,
      repair, regeneration, and renewal work together smoothly and efficiently throughout
      your entire physical body.


      Let every cell, tissue, organ, and supporting system receive the nourishment
      and care needed to maintain healthy strength, balance, and function.


      Your body''s natural maintenance systems work together, recognizing areas that
      need attention and coordinating the appropriate processes of repair and restoration.


      Let these processes support your entire body, strengthening natural vitality
      and maintaining healthy balance.


      This pattern of whole-body maintenance and renewal is permanently established
      within you.


      It continues automatically, whether you are awake, resting, or asleep, adjusting
      naturally to your body''s needs without conscious effort.


      Whenever you wish to reinforce this established pattern, you can do so easily.


      Simply close your eyes.


      If there is a particular area you wish to support, you may bring that area into
      your awareness. Otherwise, let the reinforcement apply throughout your entire
      body.


      Take a deep breath in and gently hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth and open your eyes.


      As you exhale, let your body''s natural processes of healing, repair, and renewal
      continue throughout your body, with additional attention to any area you have
      chosen.


      The more you use this command, the easier and more effective this conscious
      reinforcement becomes.


      Your body''s natural maintenance and renewal continue automatically, supporting
      healthy balance every day and every night.'
  hplus.function.ocf-bod-013.closer:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-BOD-013
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to reinforce your body''s natural healing,
      repair, regeneration, and maintenance, simply close your eyes.


      You may include a particular area in your intention, or allow the reinforcement
      to apply throughout your entire body.


      Inhale deeply and gently hold your breath.


      Silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth and open your eyes.


      This concludes your OCF Body Tune-Up exercise.'
