entries:
  hplus.function.ocf-prf-003.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will strengthen the coordination of your mind, nervous
      system, and muscles, allowing your body to move smoothly, rapidly, precisely,
      and with natural ease.'
  hplus.function.ocf-prf-003.function-body:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-PRF-003
      allowed:
      - cue.primary
    text: 'From this moment forward, let your mind, nervous system, and muscles work
      together in increasingly smooth and precise coordination.


      Signals throughout your nervous system travel quickly and efficiently, allowing
      your muscles to respond accurately and at the right moment.


      Your entire body moves with greater balance, control, accuracy, and natural
      ease.


      Each movement flows smoothly into the next, without unnecessary hesitation,
      tension, or effort.


      Your hands, feet, eyes, and muscles coordinate naturally, supporting accurate
      timing and effortless movement.


      When quick action is needed, your responses become faster and more precise.


      When careful control is needed, your movements remain steady, balanced, and
      accurate.


      Your mind and body work together automatically, allowing you to move without
      consciously directing every muscle or action.


      This pattern of improved coordination is permanently established within you.


      Your natural balance, timing, and movement precision continue strengthening
      through everyday activity and experience.


      Whenever you wish to reinforce this coordination, take a deep breath in and
      gently hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      As you exhale, let your entire physical system work together in smoother, faster,
      and more accurate coordination.


      The more you use this command, the easier and more effective this reinforcement
      becomes.'
  hplus.function.ocf-prf-003.closer:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-PRF-003
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to reinforce the speed, smoothness, balance,
      and precision of your movements, inhale deeply and gently hold your breath.


      Silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      This concludes your OCF Coordination exercise.'
