entries:
  hplus.function.ocf-com-001.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will strengthen your ability to speak, read aloud, and
      communicate clearly, confidently, and effectively, expressing yourself naturally
      and with ease.'
  hplus.function.ocf-com-001.function-body:
    status: reviewed
    version: 1.1.0
    cue_template:
      function_id: OCF-COM-001
      allowed:
      - cue.primary
    text: 'From this moment forward, let your ability to speak, read aloud, and communicate
      become clearer, stronger, and more effective.


      Your thoughts organize naturally into meaningful words, allowing you to express
      your ideas clearly and accurately.


      You speak fluently and confidently, with comfortable rhythm, precise pronunciation,
      and natural expression.


      Your breathing supports your voice with smooth, steady airflow.


      Your vocal cords, throat, tongue, lips, and mouth work together in natural coordination,
      allowing words to form easily and clearly.


      Whenever you read aloud, you recognize written words quickly, understand their
      meaning, and pronounce them accurately.


      Your ideas flow smoothly into spoken expression, helping you communicate exactly
      what you intend.


      Whether speaking with familiar people, meeting someone new, addressing a group,
      or reading aloud, you remain calm, confident, and articulate.


      You express yourself naturally, without unnecessary hesitation, tension, or
      effort.


      This ability to speak and communicate clearly is permanently established within
      you.


      Your mind, breathing, and voice continue working together automatically, strengthening
      your natural fluency and confidence through everyday communication.


      Whenever you wish to reinforce this ability, take a deep breath in and gently
      hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      As you exhale, let your thoughts flow into clear, confident speech, allowing
      you to communicate naturally and effectively.


      The more you use this command, the easier and more effective this reinforcement
      becomes.'
  hplus.function.ocf-com-001.closer:
    status: reviewed
    version: 1.1.0
    cue_template:
      function_id: OCF-COM-001
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to speak, read aloud, or communicate more clearly
      and confidently, inhale deeply and gently hold your breath.


      Silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      This concludes your OCF Speak Up exercise.'
