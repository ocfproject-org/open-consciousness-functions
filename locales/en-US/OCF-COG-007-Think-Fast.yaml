entries:
  hplus.function.ocf-cog-007.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will strengthen your ability to think quickly, clearly,
      and accurately, helping you understand information, reason effectively, and
      solve problems.'
  hplus.function.ocf-cog-007.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-COG-007
      allowed:
      - cue.primary
    text: 'From this moment forward, let your thinking become faster, clearer, and
      more accurate.


      Your mind processes information quickly, recognizing important details and understanding
      their meaning.


      Your thoughts become organized and precise, allowing you to recognize patterns,
      connect ideas, and understand complex situations with increasing ease.


      You retain relevant information in your awareness, bringing ideas together to
      form a clear understanding.


      Whenever you encounter a problem, your mind examines the available information,
      recognizes useful possibilities, and identifies effective solutions.


      New ideas and insights emerge naturally, helping you adapt to changing circumstances
      and consider different perspectives.


      Even when time is limited, your mind remains calm, confident, focused, and alert.


      You think quickly without rushing, responding with clarity, accuracy, and sound
      judgment.


      This growing ability to think clearly and rapidly is permanently established
      within you.


      Your mind continues strengthening its natural ability to process information,
      recognize connections, and solve problems through learning and experience.


      Whenever you wish to reinforce your thinking speed and mental clarity, take
      a deep breath in and gently hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      As you exhale, let your mind become clear, alert, focused, and responsive.


      The more you use this command, the easier and more effective this reinforcement
      becomes.'
  hplus.function.ocf-cog-007.closer:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-COG-007
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to think more quickly, clearly, and accurately,
      inhale deeply and gently hold your breath.


      Silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      This concludes your OCF Think Fast exercise.'
