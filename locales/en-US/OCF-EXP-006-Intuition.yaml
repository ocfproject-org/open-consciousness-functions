entries:
  hplus.function.ocf-exp-006.opener:
    status: reviewed
    version: 1.0.0
    text: |-
      This OCF exercise will strengthen your intuition, opening greater awareness of the wisdom and guidance available through your total self, higher self, and wider consciousness.
    notes: Exact previously proposed opener supplied in the authoring brief; unreviewed.
  hplus.function.ocf-exp-006.function-body:
    status: reviewed
    version: 1.0.0
    cue_template:
      function_id: OCF-EXP-006
      allowed:
      - cue.primary
    text: |-
      From this moment forward, your intuitive awareness becomes a natural and increasingly accessible part of your everyday life.

      Your conscious mind, subconscious mind, physical being, higher self, and total self work together, opening deeper channels of awareness and understanding.

      Through this connection, you become more receptive to the wisdom, knowledge, and guidance available beyond your ordinary conscious awareness.

      Your intuition draws upon your experiences, subconscious understanding, higher consciousness, and the greater awareness to which your total self is connected.

      Whenever you wish to receive intuitive guidance, bring a question or situation into your awareness.

      Silently say to yourself,
      "{{ cue.primary }}."

      Allow understanding to arise naturally.

      Guidance may come as a thought, impression, feeling, memory, sudden recognition, or direct intuitive knowing.

      Your total self brings forward information and understanding relevant to your question, making connections that may not have been apparent to your conscious mind.

      Your higher self and wider consciousness contribute their greater perspectives, helping you recognize possibilities, meanings, and directions.

      As intuitive understanding develops, you become more capable of recognizing its significance and applying it to your experiences and decisions.

      You can consider the guidance you receive, allowing it to contribute to your understanding while choosing how to respond.

      Your connection with your total self and higher consciousness continues developing naturally, without requiring constant conscious attention.

      This intuitive ability remains permanently available, becoming clearer and more accessible through experience.

      Each time you use "{{ cue.primary }}," accessing and understanding intuitive guidance becomes easier and more natural.
    notes: Newly AI-authored original candidate. Ongoing intuitive development is the intended baseline;
      deliberate command use reinforces deeper understanding. The proposed procedure has no prescribed
      breath pattern or eye closure. Consciousness-oriented language describes the practice, not verified
      access to external facts or another person's private thoughts. Editorial, procedure, rights and
      listening review remain pending. One body is proposed for four composed passes; shared preparation
      and return remain separate.
  hplus.function.ocf-exp-006.closer:
    status: reviewed
    version: 1.0.0
    cue_template:
      function_id: OCF-EXP-006
      allowed:
      - cue.primary
    text: |-
      Remember, whenever you wish to receive intuitive guidance, bring your question or situation into awareness.

      Silently say to yourself,
      "{{ cue.primary }}."

      Allow understanding to arise, and consider what it means.

      This concludes your OCF Intuition exercise.
    notes: Newly AI-authored closer and procedure reminder; unreviewed proposal.
