entries:
  hplus.function.ocf-bod-010.opener:
    status: reviewed
    version: 1.3.0
    text: 'This OCF exercise will teach you to direct how your body uses energy and
      nourishment from the food you eat, establishing a lasting pattern that remains
      active until you choose to change it.'
  hplus.function.ocf-bod-010.function-body:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-BOD-010
      allowed:
      - cue.primary
      - cue.id.OCF-CMD-BOD-010-FOOD-LESS
    text: 'From this moment forward, let your body''s natural processes of digestion,
      nourishment, and energy utilization work together smoothly and efficiently.


      Your body receives the nourishment it needs, uses available energy appropriately,
      and maintains its natural processes of balance and renewal.


      You have two commands for directing this pattern.


      The first is "{{ cue.primary }}."


      This mode encourages your body to extract and make fuller use of the available
      energy and useful nourishment from the food you eat.


      The second is "{{ cue.id.OCF-CMD-BOD-010-FOOD-LESS }}."


      This mode encourages your body to obtain sufficient nourishment for healthy
      function while reducing unnecessary energy retention and storage.


      In either mode, your body''s essential nutritional needs remain supported.


      Now understand that whichever mode you select becomes your active pattern.


      Your selected mode continues automatically throughout your everyday life, including
      meals, activities, rest, and sleep, without requiring repeated activation.


      It remains active until you deliberately select the other mode.


      When you switch modes, your new selection replaces the previous one.


      To select or change your mode, simply decide which response you want.


      Take a deep breath in and gently hold it.


      While holding your breath, silently say to yourself either "{{ cue.primary }}"
      or "{{ cue.id.OCF-CMD-BOD-010-FOOD-LESS }}," according to your choice.


      Then slowly exhale through your mouth.


      Your chosen mode is now established and remains active until you change it.


      There is no need to repeat the command before each meal.


      Whenever you wish to reinforce your current selection, you may use its command
      again.


      The more familiar you become with these commands, the easier and more natural
      selecting and reinforcing your chosen mode becomes.


      Your body''s natural processes of nourishment, energy utilization, and maintenance
      continue automatically, working in accordance with your selected pattern.'
  hplus.function.ocf-bod-010.closer:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-BOD-010
      allowed:
      - cue.primary
      - cue.id.OCF-CMD-BOD-010-FOOD-LESS
    text: 'Remember, Nutricia allows you to select between fuller nourishment and
      energy utilization with "{{ cue.primary }}," or sufficient nourishment with
      reduced unnecessary retention and storage with "{{ cue.id.OCF-CMD-BOD-010-FOOD-LESS
      }}."
      Your last selected mode remains active until you deliberately change it.


      To select, change, or reinforce your mode, inhale deeply and gently hold your
      breath.


      Silently say to yourself either "{{ cue.primary }}" or "{{ cue.id.OCF-CMD-BOD-010-FOOD-LESS
      }}."


      Then slowly exhale through your mouth.


      This concludes your OCF exercise.'
