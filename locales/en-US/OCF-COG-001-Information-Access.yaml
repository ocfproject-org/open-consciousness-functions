entries:
  hplus.function.ocf-cog-001.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to access your personal library of information, knowledge, and experience,
      bringing the information you desire directly into your conscious awareness.'
  hplus.function.ocf-cog-001.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-COG-001
      allowed:
      - cue.primary
    text: 'From this moment forward, let your ability to access your personal library of information, knowledge,
      and experience become stronger, faster, and more effective.


      Everything you have learned, observed, experienced, and understood contributes to this library of knowledge
      within you.


      Your mind continues organizing this information, connecting related memories, ideas, and experiences, even
      when you are not consciously thinking about them.


      This ability to organize and access your knowledge is permanently established within you.


      Whenever you wish to retrieve information or understand something more clearly, you can call upon this ability
      directly.


      First, think of a question or something you wish to know.


      Then silently say to yourself,

      "{{ cue.primary }}."


      Allow the relevant information, memories, ideas, and understanding to come into your conscious awareness.


      Information may become available as words, memories, ideas, images, or simple understanding.


      There is no need to experience it in any particular way. Simply recognize what becomes available to you.


      Your mind brings together related knowledge and experiences, helping you recognize connections and develop
      clearer understanding.


      Sometimes the information becomes apparent immediately. At other times, additional details and connections
      may emerge naturally as your mind continues working with your request.


      Each time you use this command, accessing and recognizing relevant knowledge becomes easier and more familiar.


      Your personal library remains available whenever you choose to consult it.


      Now, for practice, think of something you would like to remember or understand more clearly.


      Silently say to yourself,

      "{{ cue.primary }}."


      Allow whatever relevant information or understanding becomes available to enter your awareness.


      You can use this ability whenever you desire, while your mind continues organizing and connecting knowledge
      automatically.'
  hplus.function.ocf-cog-001.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-COG-001
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to access your personal library of knowledge, first think of a question or
      the information you desire.


      Silently say to yourself,

      "{{ cue.primary }}."


      Allow relevant memories, knowledge, and understanding to come into your conscious awareness.


      This concludes your OCF Information Access exercise.'
