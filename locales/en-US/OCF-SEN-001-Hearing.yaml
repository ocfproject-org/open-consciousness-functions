entries:
  hplus.function.ocf-sen-001.opener:
    status: reviewed
    version: 1.2.0
    text: |-
      This OCF exercise will teach you to adjust your hearing awareness and strengthen your ability to remember, imagine, and experience sounds within your mind.
  hplus.function.ocf-sen-001.function-body:
    status: reviewed
    version: 1.4.0
    cue_template:
      function_id: OCF-SEN-001
      allowed:
      - cue.id.OCF-CMD-SEN-001-HEAR-LESS
      - cue.primary
    text: |-
      From this moment forward, you have the ability to adjust your awareness of sound and strengthen your inner sense of hearing.

      Your conscious mind, subconscious mind, physical senses, and total self work together to respond to your intentions.

      Whenever you wish to hear sounds more clearly, close your eyes.

      Take a deep breath in and gently hold it.

      While holding your breath, silently say to yourself,
      "{{ cue.primary }}."

      Then slowly exhale through your mouth and open your eyes.

      Your awareness of sound becomes clearer and more detailed.

      Subtle sounds become easier to notice, including differences in pitch, tone, rhythm, and volume.

      Whenever you wish to reduce unwanted or distracting sounds, use the same breathing and eye sequence with the command,
      "{{ cue.id.OCF-CMD-SEN-001-HEAR-LESS }}."

      Unwanted sounds, whether coming from your surroundings or arising within your own hearing awareness, become less prominent.

      Your attention naturally shifts toward the sounds you wish to hear, while unnecessary ringing, buzzing, humming, and other distracting sounds fade into the background.

      You remain aware of important sounds around you and can change the adjustment whenever you choose.

      Your inner sense of hearing also develops, strengthening your ability to remember familiar voices, music, conversations, and other sounds.

      You may recall or imagine sounds with greater clarity, recognizing their details and qualities.

      Your total self supports both your awareness of external sounds and your ability to experience sound internally.

      These abilities remain available whenever you choose to use them.

      Each time you use "{{ cue.primary }}" or "{{ cue.id.OCF-CMD-SEN-001-HEAR-LESS }}," adjusting your awareness of sound becomes easier and more natural.
  hplus.function.ocf-sen-001.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-SEN-001
      allowed:
      - cue.id.OCF-CMD-SEN-001-HEAR-LESS
      - cue.primary
    text: |-
      Remember, whenever you wish to adjust your awareness of sound, close your eyes.

      Take a deep breath in and gently hold it.

      Silently say to yourself,
      "{{ cue.primary }}" to increase awareness, or "{{ cue.id.OCF-CMD-SEN-001-HEAR-LESS }}" to reduce unwanted sound.

      Then slowly exhale through your mouth and open your eyes.

      This concludes your OCF Hearing exercise.
