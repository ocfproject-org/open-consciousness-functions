entries:
  hplus.function.ocf-bod-005.opener:
    status: reviewed
    version: 1.2.0
    text: |-
      This OCF exercise will teach you to recognize genuine hunger, release unnecessary food cravings, and consciously direct your appetite and eating choices.
  hplus.function.ocf-bod-005.function-body:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-BOD-005
      allowed:
      - cue.primary
    text: |-
      From this moment forward, you have greater control over your appetite and your desire for food.

      Your conscious mind, subconscious mind, physical body, and total self work together to establish a natural pattern of appetite awareness and conscious choice.

      You recognize the difference between genuine hunger and the desire to eat from habit, boredom, or impulse.

      When your body needs nourishment, you recognize that need and respond appropriately.

      You become more aware of when you have eaten enough, enjoying your food and recognizing comfortable satisfaction.

      This awareness becomes a natural and automatic part of your everyday life.

      Whenever an unnecessary craving arises, you can consciously choose to release it.

      Recognize the craving you wish to release.

      Take a deep breath in and gently hold it.

      While holding your breath, silently say to yourself,
      "{{ cue.primary }}."

      Then slowly exhale through your mouth.

      The unnecessary craving loses its influence over your attention and desire to eat.

      Your mind and body return to a comfortable state of satisfaction, allowing you to continue your activities without the unwanted impulse.

      You remain free to enjoy food whenever you choose and continue recognizing your body's genuine nutritional needs.

      Your ability to recognize unnecessary cravings and make deliberate eating choices remains permanently established.

      Each time you use "{{ cue.primary }}," releasing unwanted cravings becomes easier and more natural.
  hplus.function.ocf-bod-005.closer:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-BOD-005
      allowed:
      - cue.primary
    text: |-
      Remember, whenever you wish to release an unnecessary food craving, recognize the desire you want to release.

      Take a deep breath in and gently hold it.

      Silently say to yourself,
      "{{ cue.primary }}."

      Then slowly exhale through your mouth.

      This concludes your OCF Appetite Choice exercise.
